---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bggapp-deploy
  namespace: bggns
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bggapp
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: bggapp
    spec:
      containers:
      - name: bggdb-container
        image: stackupiss/bgg-backend:v1
        envFrom:
        - configMapRef:
            name: bggapp-cm
        - secretRef:
            name: bggapp-secret
        imagePullPolicy: IfNotPresent
        ports:
        - name: bggapp-port
          containerPort: 3000
        livenessProbe:
          httpGet:
            path: /healthz
            port: podinfo-port
          initialDelaySeconds: 5
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: bggapp-svc
  namespace: bggns
spec:
  type: LoadBalancer
  selector:
    app: bggapp
  ports:
  - port: 3000
    targetPort: bggapp-port
