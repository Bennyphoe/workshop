---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: umamiapp-deploy
  namespace: workshop03
spec:
  replicas: 1
  selector:
    matchLabels:
      app: umamiapp
  template:
    metadata:
      labels:
        app: umamiapp
    spec:
      containers:
        - name: umamiapp-container
          image: ghcr.io/umami-software/umami:latest
          imagePullPolicy: IfNotPresent
          envFrom:
          - secretRef:
              name: umamiapp-secret
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: umamidb-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: umamidb-secret
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: umamidb-secret
                  key: POSTGRES_DB
            - name: DB_HOST
              value: umamidb-svc
            - name: DATABASE_URL
              value: postgresql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):5432/$(DB_NAME)
          ports:
          - name: umamiapp-port
            containerPort: 3000
          resources:
            requests:
              memory: "512Mi"
              cpu: "256m"
            limits:
              memory: "512Mi"
              cpu: "256m"
---
apiVersion: v1
kind: Service
metadata:
  name: umamiapp-svc
  namespace: workshop03
spec:
  type: ClusterIP
  selector:
    app: umamiapp
  ports:
  - port: 3000
    targetPort: umamiapp-port


---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute 
metadata:
  name: umamiapp-httproute 
  namespace: workshop03
spec:
  parentRefs:
  - name: default-gtw 
    namespace: default
    port: 80
  rules:
  - matches:
    - path:
        type: PathPrefix 
        value: /
    backendRefs:
    - name: umamiapp-svc 
      namespace: workshop03 
      port: 3000

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: umamiapp-hpa
  namespace: workshop03
spec:
  minReplicas: 1
  maxReplicas: 3
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: umamiapp-deploy
  metrics:
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 60
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60

